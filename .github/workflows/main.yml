name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Local Ubuntu
    runs-on: self-hosted

    steps:
      # ============================================================
      # 1. Récupération du code
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Vérification + installation + build
      # ============================================================
      - name: Build et vérification
        run: |
          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          echo "=== Vérification de l'environnement ==="
          node -v
          npm -v
          pm2 -v

          echo "=== Installation des dépendances ==="
          npm install

          echo "=== Build Next.js ==="
          npm run build

          echo "=== Build terminé avec succès ==="

      # ============================================================
      # 3. Déploiement (sans sudo pour éviter le blocage du runner)
      # ============================================================
      - name: Déployer vers /var/www/controle-camions
        run: |
          set -e

          echo "=== Préparation du dossier de production ==="

          mkdir -p /var/www/controle-camions

          rsync -av \
            --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules' \
            . /var/www/controle-camions/

          echo "=== Fichiers déployés avec succès ==="

      # ============================================================
      # 4. Installation production + redémarrage
      # ============================================================
      - name: Installation et redémarrage de l'application
        run: |
          set -e

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          cd /var/www/controle-camions

          echo "=== Installation des dépendances production ==="
          npm install

          echo "=== Redémarrage PM2 ==="
          pm2 restart controle-camions || pm2 start npm --name "controle-camions" -- start

          echo "=== Sauvegarde PM2 ==="
          pm2 save

          echo "=== Déploiement terminé avec succès ==="